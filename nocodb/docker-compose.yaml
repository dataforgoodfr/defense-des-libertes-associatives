# Test local : même image que sur Clever Cloud, contre un PostgreSQL 18
# comme l'add-on (sans PostGIS, inutile à NocoDB). Les variables reprennent les noms injectés par Clever Cloud.
#   docker compose -f nocodb/docker-compose.yaml up --build
#   puis http://localhost:8080
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: nocodb
      POSTGRES_PASSWORD: nocodb
      POSTGRES_DB: nocodb
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocodb"]
      interval: 2s
      retries: 20

  nocodb:
    build: .
    ports:
      - "8080:8080"
    environment:
      POSTGRESQL_ADDON_HOST: postgres
      POSTGRESQL_ADDON_PORT: "5432"
      POSTGRESQL_ADDON_USER: nocodb
      POSTGRESQL_ADDON_PASSWORD: nocodb
      POSTGRESQL_ADDON_DB: nocodb
      NC_AUTH_JWT_SECRET: local-dev-secret
      NC_PUBLIC_URL: http://localhost:8080
      NC_DISABLE_TELE: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
